<title id="t">Iker Perez — section through the machine</title><desc id="d">Section through the machine. Nine layers of Iker Perez's work, read top to bottom: 1 INTERFACE, UI IP Toolkit; 2 WEB EXPERIENCE, E36 Scroll Cine; 3 REAL-TIME 3D, Warpod Studio; 4 WEB PLATFORM, IP Linux; 5 DESKTOP 3D, NexoIP 3D Viewer; 6 PIPELINE, IP Blender Tool; 7 DEV TOOLING, Easy Localhost; 8 SECURITY, QuantumGuard PQC lab; 9 SYSTEMS, Operating systems in C.</desc>
