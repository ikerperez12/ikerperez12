.ln{stroke:#d1d9e0;fill:none}
.lns{stroke:#e4e8ed;fill:none}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .motion-only{opacity:0}
  .static-only{opacity:1!important}
}
.static-only{opacity:0}

.pw{animation-name:sw;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@keyframes sw{0%,100%{transform:rotate(-19deg)}50%{transform:rotate(19deg)}}
.p0{animation-duration:2.6s}.p1{animation-duration:2.74s}.p2{animation-duration:2.88s}.p3{animation-duration:3.02s}.p4{animation-duration:3.16s}.p5{animation-duration:3.3s}.p6{animation-duration:3.44s}.p7{animation-duration:3.58s}.p8{animation-duration:3.72s}.p9{animation-duration:3.86s}.p10{animation-duration:4s}.p11{animation-duration:4.14s}.p12{animation-duration:4.28s}.p13{animation-duration:4.42s}.p14{animation-duration:4.56s}
@media (prefers-reduced-motion:reduce){.pw{transform:rotate(0)}}
</style>
