<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
<title id="t">Pendulum wave</title><desc id="d">A row of 16 pendulums, one per public repository, swinging at periods derived from their commit counts.</desc>
<style>
.p{fill:#ffffff}
.ink{fill:#1f2328}
.dim{fill:#59636e}
.faint{fill:#818b98}
.acc{fill:#8a5d0f}
