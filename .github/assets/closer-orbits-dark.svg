<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
<title id="t">Repository orbits</title><desc id="d">11 elliptical orbits, one per public repository, with periods derived from repository size.</desc>
