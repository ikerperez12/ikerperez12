<title id="t">Iker Perez — computer engineer</title><desc id="d">Iker Perez, computer engineer in A Coruña. Every layer ships the same contract: security, accessibility, and something you can actually run. Beside the text, a pendulum wave with one arm per public repository, 2780 commits this year.</desc>
