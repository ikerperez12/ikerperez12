<title id="t">Iker Perez — computer engineer</title><desc id="d">Iker Perez, computer engineer in A Coruña. Works from C and operating systems up to real-time 3D. Today's audit: 30 engineering controls verified across 18 public repositories, 4 live deployments answering. Confirmed practices: CYCLONEDX SBOM, SHA-256 SUMS, AXE-CORE IN CI, CODEQL, SECURITY.MD. Beside the text, a pendulum wave with one arm per public repository, 2766 commits this year.</desc>
