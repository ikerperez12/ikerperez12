name: Interactive Community Telemetry Dispatch

on:
  issues:
    types: [opened]

concurrency:
  group: profile-dispatch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  dispatch:
    name: Process Interactive Dispatch Command
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'dispatch|')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Parse Dispatch Command & Update Handshake Ledger
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
            const fs = require('fs');
            const title = process.env.ISSUE_TITLE || '';
            const user = process.env.ISSUE_USER || 'anonymous';
            const parts = title.split('|');
            const cmd = parts[1] || 'ping';
            const msg = parts.slice(2).join(' ') || 'System Handshake';

            let handshakes = [];
            try {
              handshakes = JSON.parse(fs.readFileSync('telemetry_handshakes.json', 'utf8'));
            } catch (e) {}

            handshakes.unshift({
              user: user,
              command: cmd,
              message: msg.slice(0, 40),
              timestamp: new Date().toISOString()
            });

            // Keep latest 10 handshakes
            handshakes = handshakes.slice(0, 10);
            fs.writeFileSync('telemetry_handshakes.json', JSON.stringify(handshakes, null, 2));

            // Update README handshake section if markers exist
            try {
              let readme = fs.readFileSync('README.md', 'utf8');
              const startMarker = '<!-- HANDSHAKES:START -->';
              const endMarker = '<!-- HANDSHAKES:END -->';
              if (readme.includes(startMarker) && readme.includes(endMarker)) {
                let table = '| Timestamp (UTC) | Visitor / Node | Signal Payload |\n| :--- | :--- | :--- |\n';
                handshakes.slice(0, 5).forEach(h => {
                  table += \`| \${h.timestamp.replace('T', ' ').slice(0, 19)} | [@\${h.user}](https://github.com/\${h.user}) | \`\${h.command.toUpperCase()}\`: \${h.message} |\n\`;
                });
                const regex = new RegExp(\`\${startMarker}[\\\\s\\\\S]*?\${endMarker}\`);
                readme = readme.replace(regex, \`\${startMarker}\n\${table}\${endMarker}\`);
                fs.writeFileSync('README.md', readme);
              }
            } catch (e) {
              console.error('Error updating README table:', e);
            }
          "

      - name: Regenerate Profile Telemetry SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-telemetry.mjs

      - name: Add Bot Reaction & Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "⚡ **System Handshake Verified!** Your dispatch from @$ISSUE_USER has been logged into the living telemetry ledger on @ikerperez12's profile. Thanks for interacting!"
          gh issue close "$ISSUE_NUMBER"

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add telemetry_handshakes.json README.md assets/
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(telemetry): log interactive dispatch from @${{ github.event.issue.user.login }} [skip ci]" && git push)
