name: Nexo-IP Living 3D Viewport Controller

on:
  issues:
    types: [opened]

concurrency:
  group: nexo3d-viewport
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  render3d:
    name: Compute 3D Projection Matrix & Render Viewport
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'nexo3d|')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Execute 3D Math Pipeline & Regenerate Assets
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/render-3d-viewport.mjs --command "$ISSUE_TITLE" --user "$ISSUE_USER"
          node scripts/generate-telemetry.mjs

      - name: Add Bot Reaction & Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "⚡ **3D Viewport State Updated!** Camera projection recomputed and rendered for @$ISSUE_USER. View the live 3D frame on @ikerperez12's profile!"
          gh issue close "$ISSUE_NUMBER"

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ state_3d.json README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(3d-viewport): render new frame from @${{ github.event.issue.user.login }} [skip ci]" && git push)
