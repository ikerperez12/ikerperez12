name: Snake

# Anyone can move the snake by opening an issue titled `snake|<direction>`; the
# links in the README prefill it. This is the only workflow on the repository
# that a stranger can start, so it is written defensively throughout.
on:
  issues:
    types: [opened]

# Least privilege: enough to commit the new board and to answer the issue.
permissions:
  contents: write
  issues: write

# Queue, never cancel. Cancelling would silently drop somebody's move and leave
# the committed board disagreeing with the state file.
concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  move:
    # Filter in the workflow rather than in the script, so unrelated issues cost
    # a few seconds of queue time and nothing else.
    if: startsWith(github.event.issue.title, 'snake|')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Apply the move
        id: move
        # The issue title is attacker-controlled. Binding it to an environment
        # variable keeps it out of the generated shell script entirely; the
        # script then matches it against a fixed pattern before using it.
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          RESULT=$(node scripts/snake-move.mjs)
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Commit the new board
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/state/snake.json .github/assets/snake-dark.svg .github/assets/snake-light.svg README.md
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Snake: ${GITHUB_ACTOR} played"
          git pull --rebase --autostash
          git push

      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.move.outputs.result }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "$RESULT

          The board on [the profile](https://github.com/${GITHUB_REPOSITORY_OWNER}) is redrawing now. Thanks for playing."
          gh issue close "$ISSUE_NUMBER"
