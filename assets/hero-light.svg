<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <linearGradient id="heroTitleGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="60%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <pattern id="dotPatternL" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(226, 232, 240, 0.8)"/>
    </pattern>

    <style>
      @keyframes spin3D {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes waveFloat {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: -120; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .hero-title {
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
      .hero-sub {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        letter-spacing: 0.04em;
      }
      .rotating-wireframe {
        transform-origin: 770px 140px;
        animation: spin3D 24s linear infinite;
      }
      .wave-line {
        stroke-dasharray: 12 8;
        animation: waveFloat 8s linear infinite;
      }
      .radar-needle {
        transform-origin: 840px 45px;
        animation: radarSweep 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Frame Canvas -->
  <rect width="920" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect width="920" height="280" rx="14" fill="url(#dotPatternL)"/>

  <!-- Left Editorial Hero Content -->
  <g transform="translate(45, 50)">
    <!-- Top System Header Badge -->
    <g transform="translate(0, 0)">
      <rect width="260" height="24" rx="12" fill="#f8fafc" stroke="#10b981" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#10b981"/>
      <text x="24" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">SYSTEMS &amp; CREATIVE COMPUTING</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="70" class="hero-title" font-size="44" fill="url(#heroTitleGradL)">IKER PEREZ</text>
    
    <!-- Editorial Description -->
    <text x="0" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#475569">
      Computer Engineer architecting <tspan fill="#090d14" font-weight="700">Low-Level Systems</tspan>, <tspan fill="#00f0ff" font-weight="700">Interactive 3D / WebGL</tspan>,
    </text>
    <text x="0" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#475569">
      <tspan fill="#818cf8" font-weight="700">Desktop Web Environments</tspan>, and <tspan fill="#10b981" font-weight="700">Post-Quantum Security</tspan>.
    </text>

    <!-- Verified Architecture Seals -->
    <g transform="translate(0, 155)">
      <!-- Seal 1: Offline First -->
      <rect x="0" y="0" width="132" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="17" class="hero-sub" font-size="10.5" fill="#10b981">🛡️ OFFLINE-FIRST</text>

      <!-- Seal 2: CycloneDX SBOM -->
      <rect x="142" y="0" width="145" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="154" y="17" class="hero-sub" font-size="10.5" fill="#00f0ff">📦 CYCLONEDX SBOM</text>

      <!-- Seal 3: SHA-256 -->
      <rect x="297" y="0" width="145" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="309" y="17" class="hero-sub" font-size="10.5" fill="#818cf8">🔑 SHA-256 SIGNED</text>

      <!-- Seal 4: WCAG AAA -->
      <rect x="452" y="0" width="135" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="464" y="17" class="hero-sub" font-size="10.5" fill="#090d14">♿ WCAG AAA A11Y</text>
    </g>
  </g>

  <!-- Right Visual 3D Geometry & Wave Visualizer -->
  <g class="rotating-wireframe">
    <!-- Isometric 3D Polyhedron / Gyroscope rings -->
    <circle cx="770" cy="140" r="75" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="6 4"/>
    <ellipse cx="770" cy="140" rx="75" ry="32" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(35 770 140)"/>
    <ellipse cx="770" cy="140" rx="75" ry="32" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(-35 770 140)"/>
    
    <!-- Central Octahedron Core -->
    <polygon points="770,85 815,140 770,195 725,140" fill="none" stroke="#00f0ff" stroke-width="1.8"/>
    <line x1="725" y1="140" x2="815" y2="140" stroke="#00f0ff" stroke-width="1"/>
    <line x1="770" y1="85" x2="770" y2="195" stroke="#00f0ff" stroke-width="1"/>
    <circle cx="770" cy="140" r="6" fill="#00f0ff"/>
  </g>

  <!-- Radar Telemetry Widget Top Right -->
  <circle cx="840" cy="45" r="16" fill="#f8fafc" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line class="radar-needle" x1="840" y1="45" x2="840" y2="30" stroke="#00f0ff" stroke-width="1.5"/>
</svg>