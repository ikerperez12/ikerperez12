<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <linearGradient id="glowMeshL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="textGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <pattern id="dotGridL" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="rgba(226, 232, 240, 0.8)"/>
    </pattern>

    <style>
      @keyframes floatMesh {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(30px, -20px) scale(1.08); }
      }
      @keyframes pulseBeam {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.4; }
        50% { stroke-dashoffset: -200; opacity: 0.9; }
      }
      @keyframes rotateOrbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .hero-title {
        font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
      .mono-text {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .mono-sub {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.1em;
      }
      .ambient-glow {
        animation: floatMesh 12s ease-in-out infinite;
        transform-origin: center;
      }
      .flowing-signal {
        stroke-dasharray: 60 140;
        animation: pulseBeam 5s linear infinite;
      }
      .orbital-ring {
        transform-origin: 780px 150px;
        animation: rotateOrbit 24s linear infinite;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="960" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect width="960" height="300" rx="16" fill="url(#dotGridL)"/>

  <!-- Ambient Fluid Mesh Backdrop -->
  <ellipse class="ambient-glow" cx="800" cy="150" rx="260" ry="140" fill="url(#glowMeshL)"/>

  <!-- Top System Telemetry Bar -->
  <path d="M 0 16 Q 0 0 16 0 L 944 0 Q 960 0 960 16 L 960 42 L 0 42 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <circle cx="28" cy="21" r="4.5" fill="#10b981"/>
  <text x="44" y="25" class="mono-text" fill="#090d14">IKER PEREZ // SYSTEMS &amp; CREATIVE COMPUTING</text>
  <text x="560" y="25" class="mono-text" fill="#10b981">[ONLINE • 2,623 CONTRIBUTIONS / YEAR]</text>
  <text x="820" y="25" class="mono-text" fill="#94a3b8">A CORUÑA [ES]</text>

  <!-- Left Hero Content -->
  <g transform="translate(48, 65)">
    <text x="0" y="52" class="hero-title" font-size="44" fill="url(#textGradL)">IKER PEREZ</text>
    <text x="0" y="82" class="mono-sub" fill="#00f0ff">SOFTWARE ENGINEER &amp; SYSTEMS TECHNOLOGIST</text>
    
    <text x="0" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#475569">
      Building <tspan fill="#090d14" font-weight="700">Offline-First 3D Systems</tspan>, <tspan fill="#00f0ff" font-weight="700">Interactive WebGL Experiences</tspan>,
    </text>
    <text x="0" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#475569">
      <tspan fill="#818cf8" font-weight="700">Desktop Web Environments</tspan>, and <tspan fill="#10b981" font-weight="700">Post-Quantum Cryptography</tspan>.
    </text>

    <!-- Clean Vector Pills -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="130" height="26" rx="5" fill="#f8fafc" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="17" class="mono-text" font-size="10" fill="#10b981">[✓] OFFLINE-FIRST</text>

      <rect x="140" y="0" width="145" height="26" rx="5" fill="#f8fafc" stroke="#00f0ff" stroke-width="1"/>
      <text x="154" y="17" class="mono-text" font-size="10" fill="#00f0ff">[⬡] CYCLONEDX SBOM</text>

      <rect x="295" y="0" width="140" height="26" rx="5" fill="#f8fafc" stroke="#818cf8" stroke-width="1"/>
      <text x="309" y="17" class="mono-text" font-size="10" fill="#818cf8">[❖] SHA-256 SIGNED</text>

      <rect x="445" y="0" width="135" height="26" rx="5" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
      <text x="459" y="17" class="mono-text" font-size="10" fill="#090d14">[◎] WCAG AAA A11Y</text>
    </g>
  </g>

  <!-- Right Visual Kinetic Geometry -->
  <g class="orbital-ring">
    <circle cx="780" cy="150" r="85" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="6 4"/>
    <ellipse cx="780" cy="150" rx="85" ry="36" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(30 780 150)"/>
    <ellipse cx="780" cy="150" rx="85" ry="36" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(-30 780 150)"/>
    
    <!-- Central Polyhedron -->
    <polygon points="780,95 825,150 780,205 735,150" fill="none" stroke="#00f0ff" stroke-width="1.8"/>
    <circle cx="780" cy="150" r="6" fill="#00f0ff"/>
  </g>

  <!-- Flowing Signal Pulse along Bottom -->
  <path d="M 48 275 L 700 275" fill="none" stroke="#00f0ff" stroke-width="1.5" class="flowing-signal"/>
</svg>