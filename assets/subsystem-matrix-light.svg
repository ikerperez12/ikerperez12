<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <pattern id="matrixGridL" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(226, 232, 240, 0.8)" stroke-width="1"/>
    </pattern>

    <style>
      @keyframes busFlow1 {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes busFlow2 {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      @keyframes pulseReactor {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #00f0ff); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 16px #00f0ff); }
      }
      .node-header {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 12.5px;
        letter-spacing: 0.08em;
      }
      .node-title {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 11.5px;
      }
      .node-desc {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11.5px;
      }
      .tag-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9.5px;
        font-weight: 600;
      }
      .flow-emerald {
        stroke: #10b981;
        stroke-dasharray: 8 6;
        animation: busFlow1 3s linear infinite;
      }
      .flow-cyan {
        stroke: #00f0ff;
        stroke-dasharray: 8 6;
        animation: busFlow2 3.5s linear infinite;
      }
      .flow-indigo {
        stroke: #818cf8;
        stroke-dasharray: 8 6;
        animation: busFlow1 4s linear infinite;
      }
      .flow-amber {
        stroke: #f59e0b;
        stroke-dasharray: 8 6;
        animation: busFlow2 3.2s linear infinite;
      }
      .reactor-core {
        transform-origin: 480px 215px;
        animation: pulseReactor 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="960" height="430" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect width="960" height="430" rx="14" fill="url(#matrixGridL)"/>

  <!-- Top Title Bar -->
  <path d="M 0 14 Q 0 0 14 0 L 946 0 Q 960 0 960 14 L 960 38 L 0 38 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="35" y="24" class="node-header" fill="#00f0ff">SUBSYSTEM ARCHITECTURE TOPOLOGY // INTERCONNECTED RUNTIMES</text>
  <text x="790" y="24" class="tag-text" fill="#94a3b8">BUS VELOCITY: <tspan fill="#10b981">REAL-TIME</tspan></text>

  <!-- Connecting Bus Signal Lines from Central Hub to 4 Nodes -->
  <path d="M 480 215 L 260 215 L 260 120" fill="none" class="flow-emerald" stroke-width="2"/>
  <path d="M 480 215 L 700 215 L 700 120" fill="none" class="flow-cyan" stroke-width="2"/>
  <path d="M 480 215 L 260 215 L 260 310" fill="none" class="flow-indigo" stroke-width="2"/>
  <path d="M 480 215 L 700 215 L 700 310" fill="none" class="flow-amber" stroke-width="2"/>

  <!-- ==================== NODE 01: SYSTEMS & SECURITY ==================== -->
  <g transform="translate(35, 52)">
    <rect width="425" height="145" rx="8" fill="#f1f5f9" stroke="#10b981" stroke-width="1.2"/>
    <path d="M 0 0 L 425 0 L 425 26 L 0 26 Z" fill="#10b981" fill-opacity="0.12"/>
    <circle cx="16" cy="13" r="4" fill="#10b981"/>
    <text x="28" y="17" class="node-header" fill="#10b981">01 // SYSTEMS &amp; RUNTIME SECURITY</text>
    
    <text x="18" y="48" class="node-title" fill="#0f172a">NexoIP 3D Viewer</text>
    <text x="160" y="48" class="node-desc" fill="#475569">Electron sandbox, nexoip:// protocol, zero telemetry</text>
    
    <text x="18" y="70" class="node-title" fill="#0f172a">1.2-AuditoriaPQC</text>
    <text x="160" y="70" class="node-desc" fill="#475569">Post-Quantum OQS, Kyber-1024, HNDL risk analysis</text>

    <text x="18" y="92" class="node-title" fill="#0f172a">SO-SHELL / C</text>
    <text x="160" y="92" class="node-desc" fill="#475569">Low-level POSIX shell, process lifecycle, memory mgmt</text>
    
    <g transform="translate(18, 110)">
      <rect x="0" y="0" width="115" height="20" rx="3" fill="#f8fafc" stroke="#10b981" stroke-width="0.8"/>
      <text x="8" y="14" class="tag-text" fill="#10b981">SBOM: CycloneDX</text>

      <rect x="125" y="0" width="115" height="20" rx="3" fill="#f8fafc" stroke="#10b981" stroke-width="0.8"/>
      <text x="133" y="14" class="tag-text" fill="#10b981">SHA-256 Checksums</text>

      <rect x="250" y="0" width="130" height="20" rx="3" fill="#f8fafc" stroke="#10b981" stroke-width="0.8"/>
      <text x="258" y="14" class="tag-text" fill="#10b981">100% Offline-First</text>
    </g>
  </g>

  <!-- ==================== NODE 02: 3D & GRAPHICS ==================== -->
  <g transform="translate(500, 52)">
    <rect width="425" height="145" rx="8" fill="#f1f5f9" stroke="#00f0ff" stroke-width="1.2"/>
    <path d="M 0 0 L 425 0 L 425 26 L 0 26 Z" fill="#00f0ff" fill-opacity="0.12"/>
    <circle cx="16" cy="13" r="4" fill="#00f0ff"/>
    <text x="28" y="17" class="node-header" fill="#00f0ff">02 // INTERACTIVE 3D &amp; WEBGL RUNTIMES</text>

    <text x="18" y="48" class="node-title" fill="#0f172a">NexoIP 3D Viewer</text>
    <text x="160" y="48" class="node-desc" fill="#475569">Multi-format parser (GLTF, OBJ, STL, DAE)</text>

    <text x="18" y="70" class="node-title" fill="#0f172a">e36 Cinematic</text>
    <text x="160" y="70" class="node-desc" fill="#475569">BMW 318is Coupe Pack M WebGL scrollytelling</text>

    <text x="18" y="92" class="node-title" fill="#0f172a">warpod / BLENDER</text>
    <text x="160" y="92" class="node-desc" fill="#475569">React Three Fiber + GSAP motion &amp; PySide6 tools</text>

    <g transform="translate(18, 110)">
      <rect x="0" y="0" width="115" height="20" rx="3" fill="#f8fafc" stroke="#00f0ff" stroke-width="0.8"/>
      <text x="8" y="14" class="tag-text" fill="#00f0ff">Three.js / WebGL</text>

      <rect x="125" y="0" width="115" height="20" rx="3" fill="#f8fafc" stroke="#00f0ff" stroke-width="0.8"/>
      <text x="133" y="14" class="tag-text" fill="#00f0ff">Shader Pipelines</text>

      <rect x="250" y="0" width="130" height="20" rx="3" fill="#f8fafc" stroke="#00f0ff" stroke-width="0.8"/>
      <text x="258" y="14" class="tag-text" fill="#00f0ff">60 FPS Render Loop</text>
    </g>
  </g>

  <!-- ==================== NODE 03: WEB DESKTOPS ==================== -->
  <g transform="translate(35, 238)">
    <rect width="425" height="145" rx="8" fill="#f1f5f9" stroke="#818cf8" stroke-width="1.2"/>
    <path d="M 0 0 L 425 0 L 425 26 L 0 26 Z" fill="#818cf8" fill-opacity="0.12"/>
    <circle cx="16" cy="13" r="4" fill="#818cf8"/>
    <text x="28" y="17" class="node-header" fill="#818cf8">03 // DESKTOP OS &amp; DESIGN SYSTEMS</text>

    <text x="18" y="48" class="node-title" fill="#0f172a">IP-OS-LINUX</text>
    <text x="160" y="48" class="node-desc" fill="#475569">Browser Linux OS shell, window manager, IndexedDB</text>

    <text x="18" y="70" class="node-title" fill="#0f172a">UI-IP-Toolkit-v4.0</text>
    <text x="160" y="70" class="node-desc" fill="#475569">Modular component design system, CSS precision</text>

    <text x="18" y="92" class="node-title" fill="#0f172a">EASY-LOCALHOST</text>
    <text x="160" y="92" class="node-desc" fill="#475569">10 signed standalone releases, local server runtime</text>

    <g transform="translate(18, 110)">
      <rect x="0" y="0" width="115" height="20" rx="3" fill="#f8fafc" stroke="#818cf8" stroke-width="0.8"/>
      <text x="8" y="14" class="tag-text" fill="#818cf8">React 19 + Vite</text>

      <rect x="125" y="0" width="115" height="20" rx="3" fill="#f8fafc" stroke="#818cf8" stroke-width="0.8"/>
      <text x="133" y="14" class="tag-text" fill="#818cf8">WCAG AAA A11y</text>

      <rect x="250" y="0" width="130" height="20" rx="3" fill="#f8fafc" stroke="#818cf8" stroke-width="0.8"/>
      <text x="258" y="14" class="tag-text" fill="#818cf8">DOMPurify + CSP</text>
    </g>
  </g>

  <!-- ==================== NODE 04: DSP & ARCHITECTURES ==================== -->
  <g transform="translate(500, 238)">
    <rect width="425" height="145" rx="8" fill="#f1f5f9" stroke="#f59e0b" stroke-width="1.2"/>
    <path d="M 0 0 L 425 0 L 425 26 L 0 26 Z" fill="#f59e0b" fill-opacity="0.12"/>
    <circle cx="16" cy="13" r="4" fill="#f59e0b"/>
    <text x="28" y="17" class="node-header" fill="#f59e0b">04 // SIGNAL DSP &amp; CORE ARCHITECTURES</text>

    <text x="18" y="48" class="node-title" fill="#0f172a">SIGNAL-NEURAL</text>
    <text x="160" y="48" class="node-desc" fill="#475569">Signal processing, spectral analysis &amp; neural models</text>

    <text x="18" y="70" class="node-title" fill="#0f172a">Software-Design</text>
    <text x="160" y="70" class="node-desc" fill="#475569">Enterprise design patterns, SOLID, clean architecture</text>

    <text x="18" y="92" class="node-title" fill="#0f172a">GPT_CMD / Auto</text>
    <text x="160" y="92" class="node-desc" fill="#475569">CLI intelligence agents, automated workflow pipelines</text>

    <g transform="translate(18, 110)">
      <rect x="0" y="0" width="115" height="20" rx="3" fill="#f8fafc" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="8" y="14" class="tag-text" fill="#f59e0b">Python / NumPy</text>

      <rect x="125" y="0" width="115" height="20" rx="3" fill="#f8fafc" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="133" y="14" class="tag-text" fill="#f59e0b">Java Architecture</text>

      <rect x="250" y="0" width="130" height="20" rx="3" fill="#f8fafc" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="258" y="14" class="tag-text" fill="#f59e0b">DSP &amp; Signal Theory</text>
    </g>
  </g>

  <!-- ==================== CENTRAL REACTOR CORE ==================== -->
  <g class="reactor-core">
    <rect x="420" y="180" width="120" height="70" rx="8" fill="#f8fafc" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="480" cy="205" r="12" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="480" cy="205" r="5" fill="#00f0ff"/>
    <text x="480" y="238" text-anchor="middle" class="node-header" font-size="10" fill="#0f172a">CORE ENGINE</text>
  </g>
</svg>