<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseRadarArea {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.65; }
      }
      @keyframes sweepBeam {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .radar-header {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 12.5px;
        letter-spacing: 0.08em;
      }
      .radar-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
      }
      .radar-desc {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11.5px;
      }
      .radar-poly {
        animation: pulseRadarArea 5s ease-in-out infinite;
      }
      .radar-sweep-line {
        transform-origin: 660px 160px;
        animation: sweepBeam 5s linear infinite;
      }
    </style>
  </defs>

  <rect width="960" height="280" rx="14" fill="#06090e" stroke="#1a2333" stroke-width="1.5"/>
  
  <path d="M 0 14 Q 0 0 14 0 L 946 0 Q 960 0 960 14 L 960 40 L 0 40 Z" fill="#0b1019" stroke="#1a2333" stroke-width="1"/>
  <text x="35" y="24" class="radar-header" fill="#00f0ff">ENGINEERING CAPABILITY RADAR // MULTIDISCIPLINARY DOMAINS</text>

  <!-- Left: 4 Domain Cards -->
  <g transform="translate(35, 58)">
    <rect x="0" y="0" width="340" height="44" rx="6" fill="#0b1019" stroke="#10b981" stroke-width="1"/>
    <text x="14" y="18" class="radar-tag" fill="#10b981">01 // SYSTEMS, HARDENING &amp; PQC</text>
    <text x="14" y="34" class="radar-desc" fill="#94a3b8">C UNIX Shells, OQS Kyber-1024, Electron Sandboxing</text>

    <rect x="0" y="54" width="340" height="44" rx="6" fill="#0b1019" stroke="#00f0ff" stroke-width="1"/>
    <text x="14" y="72" class="radar-tag" fill="#00f0ff">02 // INTERACTIVE 3D &amp; WEBGL</text>
    <text x="14" y="88" class="radar-desc" fill="#94a3b8">Three.js 60fps, GLSL Shaders, R3F, PySide6 Blender</text>

    <rect x="0" y="108" width="340" height="44" rx="6" fill="#0b1019" stroke="#818cf8" stroke-width="1"/>
    <text x="14" y="126" class="radar-tag" fill="#818cf8">03 // DESKTOP OS &amp; DESIGN SYSTEMS</text>
    <text x="14" y="142" class="radar-desc" fill="#94a3b8">React 19, TypeScript, Virtual FS, 140+ CSS Tokens</text>

    <rect x="0" y="162" width="340" height="44" rx="6" fill="#0b1019" stroke="#f59e0b" stroke-width="1"/>
    <text x="14" y="180" class="radar-tag" fill="#f59e0b">04 // SIGNAL DSP &amp; ARCHITECTURES</text>
    <text x="14" y="196" class="radar-desc" fill="#94a3b8">Neural Signal Processing, SOLID Patterns, CI/CD</text>
  </g>

  <!-- Right: Radar Chart Visualization -->
  <g transform="translate(660, 160)">
    <circle cx="0" cy="0" r="92" fill="none" stroke="#1a2333" stroke-width="1"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#1a2333" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#1a2333" stroke-width="1" stroke-dasharray="2 2"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#1a2333" stroke-width="1"/>

    <line x1="-100" y1="0" x2="100" y2="0" stroke="#1a2333" stroke-width="1"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#1a2333" stroke-width="1"/>

    <text x="0" y="-105" text-anchor="middle" class="radar-tag" fill="#10b981">SYSTEMS (95%)</text>
    <text x="110" y="4" class="radar-tag" fill="#00f0ff">3D GRAPHICS (92%)</text>
    <text x="0" y="115" text-anchor="middle" class="radar-tag" fill="#818cf8">WEB OS (96%)</text>
    <text x="-110" y="4" text-anchor="end" class="radar-tag" fill="#f59e0b">SIGNAL/AI (88%)</text>

    <!-- Radar Sweep Beam -->
    <line class="radar-sweep-line" x1="0" y1="0" x2="92" y2="0" stroke="#00f0ff" stroke-width="1.8" stroke-opacity="0.8"/>

    <!-- Polygon Skill Level -->
    <polygon points="0,-86 84,0 0,88 -80,0" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="2" class="radar-poly"/>
    
    <circle cx="0" cy="-86" r="4" fill="#10b981"/>
    <circle cx="84" cy="0" r="4" fill="#00f0ff"/>
    <circle cx="0" cy="88" r="4" fill="#818cf8"/>
    <circle cx="-80" cy="0" r="4" fill="#f59e0b"/>
  </g>
</svg>