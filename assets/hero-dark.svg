<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraEdgeD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2a4ff"/>
      <stop offset="35%" stop-color="#fb8dff"/>
      <stop offset="70%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="metallicGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#c2a4ff"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <radialGradient id="ambientLight" cx="78%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#c2a4ff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="crystalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#c2a4ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fb8dff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowHyper" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes spinGimbal1 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinGimbal2 {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes float3D {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.03); }
      }
      @keyframes pulseInnerCore {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 6px #38bdf8); }
        50% { opacity: 1; filter: drop-shadow(0 0 18px #fb8dff); }
      }
      @keyframes lbar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes wv2_1 { 0%, 100% { height: 6px; } 50% { height: 22px; } }
      @keyframes wv2_2 { 0%, 100% { height: 8px; } 50% { height: 26px; } }
      @keyframes wv2_3 { 0%, 100% { height: 12px; } 50% { height: 20px; } }
      @keyframes wv2_4 { 0%, 100% { height: 6px; } 50% { height: 24px; } }

      .hero-main-title {
        font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      .mono-header {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .mono-tag {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        font-weight: 600;
      }
      .gimbal-ring1 {
        transform-origin: 775px 170px;
        animation: spinGimbal1 22s linear infinite;
      }
      .gimbal-ring2 {
        transform-origin: 775px 170px;
        animation: spinGimbal2 16s linear infinite;
      }
      .hyper-core-float {
        transform-origin: 775px 170px;
        animation: float3D 5s ease-in-out infinite;
      }
      .crystal-pulse {
        animation: pulseInnerCore 3.5s ease-in-out infinite;
      }
      .lbar-anim {
        animation: lbar 2s infinite linear;
      }
      .eq-bar-1 { animation: wv2_1 1s ease-in-out infinite; }
      .eq-bar-2 { animation: wv2_2 1s ease-in-out infinite 0.15s; }
      .eq-bar-3 { animation: wv2_3 1s ease-in-out infinite 0.3s; }
      .eq-bar-4 { animation: wv2_4 1s ease-in-out infinite 0.45s; }
    </style>
  </defs>

  <rect width="960" height="340" rx="18" fill="url(#auroraEdgeD)"/>
  <rect x="2" y="2" width="956" height="336" rx="16" fill="#05070c"/>
  <rect x="2" y="2" width="956" height="336" rx="16" fill="url(#ambientLight)"/>

  <path d="M 2 18 Q 2 2 18 2 L 942 2 Q 958 2 958 18 L 958 44 L 2 44 Z" fill="#090d16" stroke="rgba(194, 164, 255, 0.12)" stroke-width="1"/>
  
  <circle cx="28" cy="23" r="4.5" fill="#4ade80"/>
  <text x="44" y="27" class="mono-header" fill="#f8fafc">IKER PÉREZ GARCÍA // NEXO-IP SYSTEMS &amp; INTERACTIVE RUNTIMES</text>
  <text x="610" y="27" class="mono-tag" fill="#4ade80">[ONLINE • 2,623 CONTRIBUTIONS / YEAR]</text>
  <text x="825" y="27" class="mono-tag" fill="#64748b">A CORUÑA [ES]</text>

  <g transform="translate(2, 43)">
    <rect width="956" height="2" fill="rgba(255,255,255,0.04)"/>
    <g class="lbar-anim">
      <rect width="350" height="2" fill="url(#progGrad)"/>
    </g>
  </g>

  <g transform="translate(48, 75)">
    <text x="0" y="48" class="hero-main-title" font-size="44" fill="url(#metallicGradD)">IKER PÉREZ GARCÍA</text>
    <text x="0" y="78" class="mono-header" font-size="12" fill="#c2a4ff">SOFTWARE, SISTEMAS Y EXPERIENCIAS INTERACTIVAS</text>
    
    <text x="0" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#94a3b8">
      Ingeniería informática orientada a <tspan fill="#f8fafc" font-weight="700">software de sistemas</tspan>, <tspan fill="#38bdf8" font-weight="700">3D y WebGL interactivo</tspan>,
    </text>
    <text x="0" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#94a3b8">
      <tspan fill="#c2a4ff" font-weight="700">entornos desktop web</tspan> y <tspan fill="#4ade80" font-weight="700">criptografía post-cuántica</tspan> con evidencia pública.
    </text>

    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#090d16" stroke="#4ade80" stroke-width="1.2"/>
      <text x="14" y="18" class="mono-tag" fill="#4ade80">[✓] OFFLINE-FIRST</text>

      <rect x="140" y="0" width="145" height="28" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="154" y="18" class="mono-tag" fill="#38bdf8">[⬡] CYCLONEDX SBOM</text>

      <rect x="295" y="0" width="150" height="28" rx="6" fill="#090d16" stroke="#c2a4ff" stroke-width="1.2"/>
      <text x="309" y="18" class="mono-tag" fill="#c2a4ff">[❖] POST-QUANTUM PQC</text>

      <rect x="455" y="0" width="135" height="28" rx="6" fill="#090d16" stroke="#fb8dff" stroke-width="1.2"/>
      <text x="469" y="18" class="mono-tag" fill="#fb8dff">[◎] WCAG AAA A11Y</text>
    </g>
  </g>

  <g transform="translate(48, 290)">
    <rect class="eq-bar-1" x="0" y="0" width="5" rx="2.5" fill="#fb8dff"/>
    <rect class="eq-bar-2" x="8" y="0" width="5" rx="2.5" fill="#c2a4ff"/>
    <rect class="eq-bar-3" x="16" y="0" width="5" rx="2.5" fill="#38bdf8"/>
    <rect class="eq-bar-4" x="24" y="0" width="5" rx="2.5" fill="#4ade80"/>
    <text x="38" y="16" class="mono-tag" fill="#c2a4ff">AURASYNTH DSP ENGINE // 44.1 kHz REAL-TIME</text>
  </g>

  <g class="hyper-core-float">
    <circle cx="775" cy="170" r="70" fill="url(#crystalGlow)"/>

    <g class="gimbal-ring1">
      <ellipse cx="775" cy="170" rx="98" ry="42" fill="none" stroke="url(#auroraEdgeD)" stroke-width="1.8" stroke-opacity="0.8" stroke-dasharray="12 6" transform="rotate(-25 775 170)"/>
      <circle cx="865" cy="140" r="4" fill="#38bdf8"/>
      <circle cx="685" cy="200" r="4" fill="#fb8dff"/>
    </g>

    <g class="gimbal-ring2">
      <ellipse cx="775" cy="170" rx="96" ry="38" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.65" transform="rotate(45 775 170)"/>
      <circle cx="845" cy="220" r="3.5" fill="#c2a4ff"/>
      <circle cx="705" cy="120" r="3.5" fill="#4ade80"/>
    </g>

    <g class="crystal-pulse" filter="url(#glowHyper)" transform="translate(775, 170)">
      <polygon points="0,-45 38,-22 0,0 -38,-22" fill="#090d16" stroke="#c2a4ff" stroke-width="1.8" fill-opacity="0.85"/>
      <polygon points="0,0 38,-22 38,24 0,46" fill="#131122" stroke="#fb8dff" stroke-width="1.8" fill-opacity="0.9"/>
      <polygon points="-38,-22 0,0 0,46 -38,24" fill="#0d1424" stroke="#38bdf8" stroke-width="1.8" fill-opacity="0.9"/>

      <line x1="0" y1="-45" x2="0" y2="46" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="3 3"/>
      <line x1="-38" y1="-22" x2="38" y2="24" stroke="#c2a4ff" stroke-width="1" stroke-opacity="0.6"/>
      <line x1="-38" y1="24" x2="38" y2="-22" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>

      <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#glowHyper)"/>
    </g>
  </g>
</svg>