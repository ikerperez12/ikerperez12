<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="nexoCoreGlowD" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05080d" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="heroNameGradD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Audio / DSP Wave Gradient -->
    <linearGradient id="dspWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.15"/>
    </linearGradient>

    <pattern id="nexoGridD" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="rgba(30, 41, 59, 0.45)"/>
    </pattern>

    <style>
      @keyframes spinOrbit1 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinOrbit2 {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes pulseReactorRing {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #00f0ff); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 16px #00f0ff); }
      }
      @keyframes dspWaveFlow {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweepArm {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .hero-main-title {
        font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
      .mono-header {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .mono-tag {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        font-weight: 600;
      }
      .nexo-core-1 {
        transform-origin: 775px 160px;
        animation: spinOrbit1 20s linear infinite;
      }
      .nexo-core-2 {
        transform-origin: 775px 160px;
        animation: spinOrbit2 15s linear infinite;
      }
      .nexo-reactor {
        transform-origin: 775px 160px;
        animation: pulseReactorRing 4s ease-in-out infinite;
      }
      .dsp-waveform {
        stroke-dasharray: 180 320;
        animation: dspWaveFlow 7s linear infinite;
      }
      .reticle-sweep {
        transform-origin: 885px 44px;
        animation: radarSweepArm 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="960" height="320" rx="16" fill="#05080d" stroke="#142033" stroke-width="1.5"/>
  <rect width="960" height="320" rx="16" fill="url(#nexoGridD)"/>
  <rect width="960" height="320" rx="16" fill="url(#nexoCoreGlowD)"/>

  <!-- Top System Bar -->
  <path d="M 0 16 Q 0 0 16 0 L 944 0 Q 960 0 960 16 L 960 42 L 0 42 Z" fill="#0a101a" stroke="#142033" stroke-width="1"/>
  
  <circle cx="28" cy="21" r="4.5" fill="#10b981"/>
  <text x="44" y="25" class="mono-header" fill="#f8fafc">IKER PÉREZ GARCÍA // NEXO-IP SYSTEMS &amp; INTERACTIVE RUNTIMES</text>
  <text x="610" y="25" class="mono-tag" fill="#10b981">[ONLINE • 2,623 CONTRIBUTIONS / YEAR]</text>
  <text x="825" y="25" class="mono-tag" fill="#64748b">A CORUÑA [ES]</text>

  <!-- Left Editorial Content (Alinged with nexoip.click) -->
  <g transform="translate(48, 65)">
    <text x="0" y="48" class="hero-main-title" font-size="42" fill="url(#heroNameGradD)">IKER PÉREZ GARCÍA</text>
    <text x="0" y="78" class="mono-header" font-size="12" fill="#00f0ff">SOFTWARE, SISTEMAS Y EXPERIENCIAS INTERACTIVAS</text>
    
    <text x="0" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#94a3b8">
      Ingeniería informática orientada a <tspan fill="#f8fafc" font-weight="700">software de sistemas</tspan>, <tspan fill="#00f0ff" font-weight="700">3D y WebGL interactivo</tspan>,
    </text>
    <text x="0" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#94a3b8">
      <tspan fill="#818cf8" font-weight="700">entornos desktop web</tspan> y <tspan fill="#10b981" font-weight="700">criptografía post-cuántica</tspan> con evidencia pública.
    </text>

    <!-- Technical Badges (Zero Emojis) -->
    <g transform="translate(0, 162)">
      <rect x="0" y="0" width="130" height="26" rx="5" fill="#0a101a" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="17" class="mono-tag" fill="#10b981">[✓] OFFLINE-FIRST</text>

      <rect x="140" y="0" width="145" height="26" rx="5" fill="#0a101a" stroke="#00f0ff" stroke-width="1"/>
      <text x="154" y="17" class="mono-tag" fill="#00f0ff">[⬡] CYCLONEDX SBOM</text>

      <rect x="295" y="0" width="150" height="26" rx="5" fill="#0a101a" stroke="#818cf8" stroke-width="1"/>
      <text x="309" y="17" class="mono-tag" fill="#818cf8">[❖] POST-QUANTUM PQC</text>

      <rect x="455" y="0" width="135" height="26" rx="5" fill="#0a101a" stroke="#f59e0b" stroke-width="1"/>
      <text x="469" y="17" class="mono-tag" fill="#f59e0b">[◎] WCAG AAA A11Y</text>
    </g>
  </g>

  <!-- Real Audio / DSP Waveform along Bottom Left (Connecting to AURASYNTH & DSP) -->
  <path d="M 48 290 Q 110 265 170 290 T 290 290 T 410 290 T 530 290 T 650 290" fill="none" stroke="url(#dspWaveGrad)" stroke-width="2.5" class="dsp-waveform"/>

  <!-- Right Visual: The Nexo-IP Holographic System Core & Geometric Bus -->
  <g transform="translate(0, 0)">
    <!-- Concentric Multi-Bus Orbits -->
    <g class="nexo-core-1">
      <circle cx="775" cy="160" r="95" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 6"/>
      <polygon points="775,65 857,208 693,208" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.45"/>
    </g>

    <g class="nexo-core-2">
      <ellipse cx="775" cy="160" rx="90" ry="40" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(35 775 160)"/>
      <ellipse cx="775" cy="160" rx="90" ry="40" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(-35 775 160)"/>
    </g>

    <!-- Central Nexo Reactor Hub -->
    <g class="nexo-reactor">
      <circle cx="775" cy="160" r="30" fill="#0a101a" stroke="#00f0ff" stroke-width="2"/>
      <circle cx="775" cy="160" r="14" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="775" cy="160" r="6" fill="#00f0ff"/>
      
      <!-- Crosshairs -->
      <line x1="740" y1="160" x2="810" y2="160" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6"/>
      <line x1="775" y1="125" x2="775" y2="195" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6"/>
    </g>
  </g>
</svg>