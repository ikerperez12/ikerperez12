<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="100%">
  <defs>
    <!-- 1. Aurora Conic-like Linear Multi-stop Gradient -->
    <linearGradient id="auroraEdgeD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2a4ff"/>
      <stop offset="35%" stop-color="#fb8dff"/>
      <stop offset="70%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- 2. Metallic Silver / Cyan Gradient for Typography -->
    <linearGradient id="metallicGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- 3. Indeterminate Progress Bar Gradient -->
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#c2a4ff"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- 4. Ambient Radial Glow -->
    <radialGradient id="auroraCoreGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2a4ff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#fb8dff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#060507" stop-opacity="0"/>
    </radialGradient>

    <!-- Background Pattern -->
    <pattern id="heroGridD" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="rgba(194, 164, 255, 0.08)"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glowAurora" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes spinOrbit1 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinOrbit2 {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes pulseReactor {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #c2a4ff); }
        50% { transform: scale(1.12); filter: drop-shadow(0 0 16px #fb8dff); }
      }
      @keyframes lbar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes wv2_1 { 0%, 100% { height: 6px; } 50% { height: 22px; } }
      @keyframes wv2_2 { 0%, 100% { height: 8px; } 50% { height: 26px; } }
      @keyframes wv2_3 { 0%, 100% { height: 12px; } 50% { height: 20px; } }
      @keyframes wv2_4 { 0%, 100% { height: 6px; } 50% { height: 24px; } }

      .hero-main-title {
        font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      .mono-header {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .mono-tag {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        font-weight: 600;
      }
      .orbit-1 {
        transform-origin: 775px 170px;
        animation: spinOrbit1 20s linear infinite;
      }
      .orbit-2 {
        transform-origin: 775px 170px;
        animation: spinOrbit2 14s linear infinite;
      }
      .reactor-hub {
        transform-origin: 775px 170px;
        animation: pulseReactor 4s ease-in-out infinite;
      }
      .lbar-anim {
        animation: lbar 2s infinite linear;
      }
      .eq-bar-1 { animation: wv2_1 1s ease-in-out infinite; }
      .eq-bar-2 { animation: wv2_2 1s ease-in-out infinite 0.15s; }
      .eq-bar-3 { animation: wv2_3 1s ease-in-out infinite 0.3s; }
      .eq-bar-4 { animation: wv2_4 1s ease-in-out infinite 0.45s; }
    </style>
  </defs>

  <!-- Outer Aurora Gradient Border Frame (conic-style padding: 2px) -->
  <rect width="960" height="340" rx="18" fill="url(#auroraEdgeD)"/>
  
  <!-- Inner Obsidian Luxury Background Canvas -->
  <rect x="2" y="2" width="956" height="336" rx="16" fill="#060507"/>
  <rect x="2" y="2" width="956" height="336" rx="16" fill="url(#heroGridD)"/>
  <rect x="2" y="2" width="956" height="336" rx="16" fill="url(#auroraCoreGlow)"/>

  <!-- Top System Bar -->
  <path d="M 2 18 Q 2 2 18 2 L 942 2 Q 958 2 958 18 L 958 44 L 2 44 Z" fill="#0c0a10" stroke="rgba(194, 164, 255, 0.15)" stroke-width="1"/>
  
  <circle cx="28" cy="23" r="4.5" fill="#4ade80"/>
  <text x="44" y="27" class="mono-header" fill="#f8fafc">IKER PÉREZ GARCÍA // NEXO-IP SYSTEMS &amp; INTERACTIVE RUNTIMES</text>
  <text x="610" y="27" class="mono-tag" fill="#4ade80">[ONLINE • 2629 CONTRIBUTIONS / YEAR]</text>
  <text x="825" y="27" class="mono-tag" fill="#64748b">A CORUÑA [ES]</text>

  <!-- Indeterminate Scanline Progress Beam under Top Bar -->
  <g transform="translate(2, 43)">
    <rect width="956" height="2" fill="rgba(255,255,255,0.05)"/>
    <g class="lbar-anim">
      <rect width="350" height="2" fill="url(#progGrad)"/>
    </g>
  </g>

  <!-- Left Editorial Content (Aligned with nexoip.click) -->
  <g transform="translate(48, 75)">
    <text x="0" y="48" class="hero-main-title" font-size="44" fill="url(#metallicGradD)">IKER PÉREZ GARCÍA</text>
    <text x="0" y="78" class="mono-header" font-size="12" fill="#c2a4ff">SOFTWARE, SISTEMAS Y EXPERIENCIAS INTERACTIVAS</text>
    
    <text x="0" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#94a3b8">
      Ingeniería informática orientada a <tspan fill="#f8fafc" font-weight="700">software de sistemas</tspan>, <tspan fill="#38bdf8" font-weight="700">3D y WebGL interactivo</tspan>,
    </text>
    <text x="0" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#94a3b8">
      <tspan fill="#c2a4ff" font-weight="700">entornos desktop web</tspan> y <tspan fill="#4ade80" font-weight="700">criptografía post-cuántica</tspan> con evidencia pública.
    </text>

    <!-- Technical Badges (Aurora styled, Zero Emojis) -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#0c0a10" stroke="#4ade80" stroke-width="1.2"/>
      <text x="14" y="18" class="mono-tag" fill="#4ade80">[✓] OFFLINE-FIRST</text>

      <rect x="140" y="0" width="145" height="28" rx="6" fill="#0c0a10" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="154" y="18" class="mono-tag" fill="#38bdf8">[⬡] CYCLONEDX SBOM</text>

      <rect x="295" y="0" width="150" height="28" rx="6" fill="#0c0a10" stroke="#c2a4ff" stroke-width="1.2"/>
      <text x="309" y="18" class="mono-tag" fill="#c2a4ff">[❖] POST-QUANTUM PQC</text>

      <rect x="455" y="0" width="135" height="28" rx="6" fill="#0c0a10" stroke="#fb8dff" stroke-width="1.2"/>
      <text x="469" y="18" class="mono-tag" fill="#fb8dff">[◎] WCAG AAA A11Y</text>
    </g>
  </g>

  <!-- Audio Equalizer Bars (Connecting to AURASYNTH & DSP) -->
  <g transform="translate(48, 290)">
    <rect class="eq-bar-1" x="0" y="0" width="5" rx="2.5" fill="#fb8dff"/>
    <rect class="eq-bar-2" x="8" y="0" width="5" rx="2.5" fill="#c2a4ff"/>
    <rect class="eq-bar-3" x="16" y="0" width="5" rx="2.5" fill="#38bdf8"/>
    <rect class="eq-bar-4" x="24" y="0" width="5" rx="2.5" fill="#4ade80"/>
    <text x="38" y="16" class="mono-tag" fill="#c2a4ff">AURASYNTH DSP ENGINE // 44.1 kHz REAL-TIME</text>
  </g>

  <!-- Right Visual: The Bespoke Nexo-IP Quantum Core & Multi-Ring Gyroscope -->
  <g transform="translate(0, 0)">
    <!-- Outer Aurora Prismatic Orbit Ring -->
    <g class="orbit-1">
      <circle cx="775" cy="170" r="100" fill="none" stroke="url(#auroraEdgeD)" stroke-width="1.8" stroke-opacity="0.8" stroke-dasharray="8 6"/>
      <polygon points="775,70 862,220 688,220" fill="none" stroke="#c2a4ff" stroke-width="1.2" stroke-opacity="0.5"/>
    </g>

    <!-- Counter-Rotating Equatorial Orbit Rings -->
    <g class="orbit-2">
      <ellipse cx="775" cy="170" rx="96" ry="42" fill="none" stroke="#fb8dff" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(35 775 170)"/>
      <ellipse cx="775" cy="170" rx="96" ry="42" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(-35 775 170)"/>
    </g>

    <!-- Central Quantum Reactor Core (Pulsing Glow) -->
    <g class="reactor-hub" filter="url(#glowAurora)">
      <circle cx="775" cy="170" r="32" fill="#0c0a10" stroke="#c2a4ff" stroke-width="2"/>
      <circle cx="775" cy="170" r="16" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="775" cy="170" r="7" fill="#38bdf8"/>
      
      <!-- Holographic Reticle Crosshairs -->
      <line x1="735" y1="170" x2="815" y2="170" stroke="#c2a4ff" stroke-width="1" stroke-opacity="0.7"/>
      <line x1="775" y1="130" x2="775" y2="210" stroke="#c2a4ff" stroke-width="1" stroke-opacity="0.7"/>
    </g>
  </g>
</svg>