<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 85" width="100%" height="100%">
  <defs>
    <linearGradient id="headerAurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2a4ff"/>
      <stop offset="35%" stop-color="#fb8dff"/>
      <stop offset="70%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="headerTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <linearGradient id="headerBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <style>
      @keyframes beamSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .sec-title {
        font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.01em;
      }
      .sec-mono {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      .sec-pill {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        font-weight: 600;
      }
      .beam-loop {
        animation: beamSlide 3s infinite linear;
      }
    </style>
  </defs>

  <rect width="960" height="85" rx="14" fill="url(#headerAurora)"/>
  <rect x="2" y="2" width="956" height="81" rx="12" fill="#ffffff"/>

  <g transform="translate(2, 2)">
    <rect width="956" height="2" fill="rgba(255,255,255,0.05)"/>
    <g class="beam-loop">
      <rect width="300" height="2" fill="url(#headerBeam)"/>
    </g>
  </g>

  <g transform="translate(30, 48)">
    <rect x="0" y="-20" width="38" height="24" rx="5" fill="#f8fafc" stroke="#c2a4ff" stroke-width="1.2"/>
    <text x="19" y="-4" text-anchor="middle" class="sec-mono" fill="#c2a4ff">02</text>
    <text x="50" y="-2" class="sec-title" font-size="22" fill="url(#headerTitleGrad)">PROYECTOS PÚBLICOS &amp; GALERÍA BENTO</text>
  </g>

  <g transform="translate(680, 28)">
    <rect width="250" height="30" rx="6" fill="#f8fafc" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="15" cy="15" r="4" fill="#4ade80"/>
    <text x="28" y="19" class="sec-pill" fill="#090d14">12 REPOSITORIOS • OPEN SOURCE</text>
  </g>
</svg>